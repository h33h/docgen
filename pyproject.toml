[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.1.0"
description = "Generate structured DOCX documents and PPTX presentations from validated JSON configurations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=0.8.11",
  "python-pptx>=0.6.21",
  "matplotlib>=3.5.0",
  "numpy>=1.21.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
docgen = "docgen.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["docgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
